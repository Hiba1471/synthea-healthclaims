<svg viewBox="0 0 340 120" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Calder Health mark: nodes of care held in balance, echoing a Calder mobile -->
  <circle cx="60" cy="60" r="58" fill="#1f4a40"/>

  <!-- balancing arms -->
  <path d="M 60 37 Q 46 52 35 69" stroke="#e8f3ef" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 60 37 Q 74 50 82 65" stroke="#e8f3ef" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 60 37 Q 60 62 60 89" stroke="#e8f3ef" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- the member, held at the centre -->
  <circle cx="60" cy="37" r="11" fill="#e8f3ef"/>

  <!-- points of care, in balance around them -->
  <circle cx="35" cy="69" r="7" fill="#2f8a75"/>
  <circle cx="82" cy="65" r="6" fill="#2f8a75"/>
  <circle cx="60" cy="89" r="5.5" fill="#2f8a75"/>

  <!-- wordmark -->
  <text x="140" y="58" font-size="30" font-weight="700" fill="#1f4a40" letter-spacing="-0.3">Calder</text>
  <text x="140" y="88" font-size="30" font-weight="400" fill="#2f8a75" letter-spacing="-0.3">Health</text>
</svg>
